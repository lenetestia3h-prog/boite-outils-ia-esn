<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>La boîte à outils IA de l'ESN</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --teal-dark: #0F6E56;
    --coral: #D85A30;
    --coral-light: #FAECE7;
    --coral-dark: #993C1D;
    --blue: #378ADD;
    --blue-light: #E6F1FB;
    --blue-dark: #185FA5;
    --purple: #7F77DD;
    --purple-light: #EEEDFE;
    --purple-dark: #3C3489;
    --amber: #EF9F27;
    --amber-light: #FAEEDA;
    --amber-dark: #854F0B;
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --text-primary: #1a1a18;
    --text-secondary: #5F5E5A;
    --text-tertiary: #888780;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.18);
  }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
  }

  .slide {
    width: 1920px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    padding: 56px 80px 52px;
    position: relative;
    overflow: hidden;
  }

  /* Decorative background blob */
  .slide::before {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(29,158,117,0.08) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .slide::after {
    content: '';
    position: absolute;
    bottom: -150px; left: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(239,159,39,0.07) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 44px;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--teal-dark);
    background: var(--teal-light); padding: 7px 18px;
    border-radius: 30px;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 42px; font-weight: 800;
    color: var(--text-primary); line-height: 1.1;
  }
  .header h1 em { font-style: normal; color: var(--teal); }
  .header-hint {
    font-size: 16px; color: var(--text-tertiary);
    display: flex; align-items: center; gap: 8px;
  }
  .header-hint span {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 14px;
  }

  /* Grid — 3 cols top, 2 cols bottom centered */
  .grid-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 0;
  }
  .grid-row {
    display: flex;
    gap: 20px;
    flex: 1;
    min-height: 0;
  }
  .grid-row.row-bottom {
    justify-content: center;
  }
  .grid-row.row-bottom .card {
    width: calc((1920px - 160px - 40px) / 3);
    max-width: calc((1920px - 160px - 40px) / 3);
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 32px 24px;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s, border-color 0.18s;
    position: relative;
    overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
    border-radius: 20px 20px 0 0;
  }
  .card.teal::before { background: var(--teal); }
  .card.coral::before { background: var(--coral); }
  .card.blue::before { background: var(--blue); }
  .card.purple::before { background: var(--purple); }
  .card.amber::before { background: var(--amber); }

  .card:hover {
    transform: translateY(-6px) scale(1.015);
    box-shadow: 0 16px 48px rgba(0,0,0,0.1);
    border-color: var(--border-hover);
  }
  .card:active { transform: scale(0.99); }

  .card-top {
    display: flex; align-items: flex-start; gap: 16px;
    margin-bottom: 16px; margin-top: 6px;
  }
  .card-emoji { font-size: 42px; line-height: 1; flex-shrink: 0; }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--text-primary); line-height: 1.3;
    padding-top: 4px;
  }

  .badge-ai {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500;
    padding: 5px 14px; border-radius: 30px;
    margin-bottom: 14px;
    width: fit-content;
  }
  .badge-llm { background: var(--teal-light); color: var(--teal-dark); }
  .badge-agentique { background: var(--purple-light); color: var(--purple-dark); }

  .card-jobs {
    display: flex; flex-wrap: wrap; gap: 7px;
    margin-top: auto; padding-top: 14px;
  }
  .job-tag {
    font-size: 13px; padding: 4px 12px; border-radius: 30px;
    background: var(--bg); color: var(--text-secondary);
    border: 1px solid var(--border);
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.2s, transform 0.2s;
  }
  .card:hover .job-tag { opacity: 1; transform: translateY(0); }

  .card-footer {
    margin-top: 12px; font-size: 14px;
    color: var(--text-tertiary);
  }

  /* Overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20, 20, 18, 0.55);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  /* Modal */
  .modal {
    background: var(--surface);
    border-radius: 24px;
    border: 1px solid var(--border);
    width: 100%; max-width: 900px;
    max-height: 85vh; overflow-y: auto;
    padding: 2.5rem 3rem;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.22s cubic-bezier(.34,1.3,.64,1);
  }
  .overlay.open .modal { transform: translateY(0) scale(1); }

  .modal-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem;
  }
  .back-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; color: var(--text-secondary);
    background: none; border: 1px solid var(--border);
    padding: 9px 20px; border-radius: 12px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .back-btn:hover { background: var(--bg); border-color: var(--border-hover); }
  .close-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: none; border: 1px solid var(--border);
    cursor: pointer; font-size: 16px; color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .close-btn:hover { background: var(--bg); }

  .modal-header { display: flex; align-items: center; gap: 18px; margin-bottom: 1.25rem; }
  .modal-emoji { font-size: 48px; }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 28px; font-weight: 700; color: var(--text-primary);
  }

  .modal-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.75rem; }
  .modal-meta .badge-ai { font-size: 14px; padding: 6px 16px; margin-bottom: 0; }
  .modal-meta .badge-job {
    font-size: 14px; padding: 6px 16px; border-radius: 30px;
    background: var(--bg); color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .divider { height: 4px; border-radius: 2px; width: 48px; margin-bottom: 1.75rem; }

  .use-cases { display: flex; flex-direction: column; gap: 14px; }
  .use-case {
    padding: 1.25rem 1.5rem;
    background: var(--bg);
    border-radius: 14px;
    border-left: 4px solid transparent;
    transition: background 0.15s;
  }
  .use-case:hover { background: #F0EFE9; }
  .use-case.teal { border-left-color: var(--teal); }
  .use-case.coral { border-left-color: var(--coral); }
  .use-case.blue { border-left-color: var(--blue); }
  .use-case.purple { border-left-color: var(--purple); }
  .use-case.amber { border-left-color: var(--amber); }

  .uc-name {
    font-family: 'Syne', sans-serif;
    font-size: 17px; font-weight: 700;
    color: var(--text-primary); margin-bottom: 6px;
  }
  .uc-desc { font-size: 15px; color: var(--text-secondary); line-height: 1.65; }

  .modal::-webkit-scrollbar { width: 4px; }
  .modal::-webkit-scrollbar-track { background: transparent; }
  .modal::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <div class="header-left">
      <div class="eyebrow">✦ Formation IA</div>
      <h1>La boîte à outils IA <em>de l'ESN</em></h1>
    </div>
    <div class="header-hint">
      <span>👆 Cliquez sur une carte pour explorer</span>
    </div>
  </div>

  <div class="grid-wrapper">
    <div class="grid-row row-top" id="row-top"></div>
    <div class="grid-row row-bottom" id="row-bottom"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-nav">
      <button class="back-btn" id="back-btn">← Retour à la boîte à outils</button>
      <button class="close-btn" id="close-btn">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const data = [
  {
    emoji: "🎯", title: "Avant-vente & propositions",
    accent: "teal", aiLabel: "🤖 LLM", aiClass: "badge-llm",
    jobs: ["💼 Commercial", "🎯 Directeur"],
    useCases: [
      { name: "Rédiger une proposition commerciale", desc: "Mettre en forme une réponse à un appel d'offres, adapter un pitch au secteur du client, traduire une offre technique en langage business" },
      { name: "Préparer une réunion de découverte", desc: "Préparer les bonnes questions à poser, résumer ce qu'on sait déjà du prospect, anticiper les objections courantes" },
      { name: "Reformuler un besoin flou", desc: "Transformer un brief vague en liste de besoins clairs, repérer les points manquants, proposer des questions de cadrage" }
    ]
  },
  {
    emoji: "💬", title: "SAV, onboarding & formation client",
    accent: "coral", aiLabel: "🤖 LLM", aiClass: "badge-llm",
    jobs: ["📌 Chef de projet", "💼 Commercial"],
    useCases: [
      { name: "Répondre aux demandes clients", desc: "Rédiger une réponse à un mail de question, reformuler une explication technique en langage simple, adapter le ton selon le client" },
      { name: "Gérer les situations délicates", desc: "Formuler un message d'excuse pour un retard ou un bug, expliquer une contrainte sans jargon, proposer une solution alternative" },
      { name: "Former et accompagner la prise en main", desc: "Créer un guide pas-à-pas pour une nouvelle fonctionnalité, préparer une démo ou une session de formation, adapter la documentation aux spécificités d'un client" }
    ]
  },
  {
    emoji: "📋", title: "Gestion de projet & reporting",
    accent: "blue", aiLabel: "🤖 LLM", aiClass: "badge-llm",
    jobs: ["📌 Chef de projet", "🎯 Directeur"],
    useCases: [
      { name: "Rédiger les livrables projet", desc: "Compte-rendu de réunion, plan de projet, note de cadrage, mail de synthèse client" },
      { name: "Suivre l'avancement", desc: "Résumer l'état d'un projet à partir de notes éparses, identifier les points bloquants, préparer un reporting hebdomadaire" },
      { name: "Communiquer en interne et avec le client", desc: "Reformuler un problème technique pour un client non-technique, rédiger une alerte de retard, synthétiser une décision d'équipe" }
    ]
  },
  {
    emoji: "💻", title: "Développement & qualité",
    accent: "purple", aiLabel: "🤖 LLM + 🎨 Spécialisée", aiClass: "badge-llm",
    jobs: ["👨‍💻 Développeur", "📌 Chef de projet"],
    useCases: [
      { name: "Écrire du code plus vite", desc: "Générer une fonction à partir d'une description en français, créer la structure de base d'un nouveau projet, utiliser un assistant IA dans son éditeur (Copilot, Cursor)" },
      { name: "Expliquer et documenter le code", desc: "Générer les explications d'une fonction, rédiger un guide technique pour un autre développeur, produire un résumé lisible pour un non-technique" },
      { name: "Trouver et corriger les bugs", desc: "Identifier la cause d'une erreur, proposer une correction, vérifier que le reste du code n'est pas impacté" },
      { name: "Tester et vérifier la qualité", desc: "Générer des scénarios de test, imaginer les situations inattendues, détecter les parties du code difficiles à maintenir" }
    ]
  },
  {
    emoji: "🚀", title: "Automatisation & workflows",
    accent: "amber", aiLabel: "⚙️ IA Agentique", aiClass: "badge-agentique",
    jobs: ["💼 Commercial", "📌 Chef de projet", "👨‍💻 Développeur", "🎯 Directeur"],
    useCases: [
      { name: "Supprimer les tâches répétitives", desc: "Trier et répondre aux mails courants, extraire des informations depuis des documents (PDF, Excel), mettre à jour un tableau de suivi automatiquement" },
      { name: "Connecter ses outils entre eux", desc: "Faire communiquer ses applications (ex : un mail reçu crée automatiquement une tâche), envoyer un résumé de réunion automatiquement après un appel" },
      { name: "Gagner du temps sur l'administratif", desc: "Générer une facture ou un devis depuis un modèle, relancer automatiquement un client, archiver et classer des documents" }
    ]
  }
];

const accentColors = { teal: '#1D9E75', coral: '#D85A30', blue: '#378ADD', purple: '#7F77DD', amber: '#EF9F27' };

const rowTop = document.getElementById('row-top');
const rowBottom = document.getElementById('row-bottom');

data.forEach((cat, i) => {
  const card = document.createElement('div');
  card.className = `card ${cat.accent}`;
  card.innerHTML = `
    <div class="card-top">
      <span class="card-emoji">${cat.emoji}</span>
      <span class="card-title">${cat.title}</span>
    </div>
    <span class="badge-ai ${cat.aiClass}">${cat.aiLabel}</span>
    <div class="card-jobs">${cat.jobs.map(j => `<span class="job-tag">${j}</span>`).join('')}</div>
    <div class="card-footer">${cat.useCases.length} cas d'usage →</div>
  `;
  card.addEventListener('click', () => openModal(i));
  if (i < 3) rowTop.appendChild(card);
  else rowBottom.appendChild(card);
});

function openModal(i) {
  const cat = data[i];
  const color = accentColors[cat.accent];
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <span class="modal-emoji">${cat.emoji}</span>
      <span class="modal-title">${cat.title}</span>
    </div>
    <div class="modal-meta">
      <span class="badge-ai ${cat.aiClass}">${cat.aiLabel}</span>
      ${cat.jobs.map(j => `<span class="badge-job">${j}</span>`).join('')}
    </div>
    <div class="divider" style="background:${color}"></div>
    <div class="use-cases">
      ${cat.useCases.map(uc => `
        <div class="use-case ${cat.accent}">
          <div class="uc-name">${uc.name}</div>
          <div class="uc-desc">${uc.desc}</div>
        </div>
      `).join('')}
    </div>
  `;
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('open'));
}

function closeModal() {
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; }, 220);
}

document.getElementById('back-btn').addEventListener('click', closeModal);
document.getElementById('close-btn').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});
</script>
</body>
</html>
